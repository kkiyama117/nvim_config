# rvpm options — plugins added in P3
# config_root stays unset (§2.3: cannot relocate config.toml itself)

[options]
# D5: default "install" silently self-updates the rvpm binary on every invocation
auto_update = "notify"
# D6: rvpm update skips commits younger than this (default 1d)
cooldown = "1d"
# matches yukimemi/rvpm author config
concurrency = 16
# false during migration: config.toml is incomplete until P3; avoid deleting clones on sync
auto_clean = false

