# Custom fragment for the quint language server.
# kakehashi-lspconfig has no quint fragment, so this repo-owned fragment is
# merged by after/lsp/kakehashi.lua (build_lsp_toml falls back to
# after/lsp/fragments/ when the kakehashi-lspconfig lsp/ dir lacks one).
# If upstream ever ships a quint fragment, it silently wins over this one.
# `enabled` is flipped to true in ~/.config/kakehashi/kakehashi.toml.
[languageServers.quint]
enabled = false
cmd = ["quint-language-server", "--stdio"]
languages = ["qnt"]
workspaceMarkers = ["quint.config.json", ".git"]
