# SchemaStore.nvim - Json Schema
[[plugins]]
repo = "b0o/SchemaStore.nvim"
on_event = "FileType"

# mason.nvim - LSP/DAP installer
#   Installs LSP servers and DAP adapters (codelldb, …) into
#   ~/.local/share/nvim/mason. kakehashi bridges servers installed by
#   mise (see ~/.config/mise/config.toml); mason-installed servers are
#   resolved by after/lsp/kakehashi.lua via the $MASON/bin fallback in
#   resolve_cmd_line. rustaceanvim auto-detects mason-installed codelldb
#   for DAP (see lua/hooks/rustaceanvim.dpp).
#   Eager (lazy = false): deps/*.toml defaults to lazy, and a lazy plugin
#   with no on_* trigger never loads — mason-registry must be requireable
#   when rustaceanvim evaluates its DAP adapter, and setup() sets $MASON
#   for resolve_cmd_line.
[[plugins]]
repo = "williamboman/mason.nvim"
lazy = false
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/mason.nvim.dpp"

# nvim-lspconfig - LSP client configurations
#   Holds the per-server vim.lsp.config definitions that the kakehashi
#   bridge inherits (see lua/hooks/nvim-lspconfig.dpp).
#   Loaded on FileType (like the old mason.nvim entry): nvim-lspconfig
#   must stay lazy so its lazy `depends` (ddc-source-lsp, group "ddc") can
#   be sourced by dpp — a non-lazy plugin cannot depend on a lazy one.
[[plugins]]
repo = "neovim/nvim-lspconfig"
depends = ["ddc-source-lsp", "SchemaStore.nvim"]
on_event = "FileType"
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/nvim-lspconfig.dpp"

# kakehashi-lspconfig - Server-side languageServers for kakehashi
#   https://github.com/atusy/kakehashi-lspconfig
#   Not a Neovim plugin (no lua/plugin entrypoint): ships lsp/*.toml
#   fragments (converted from nvim-lspconfig) that after/lsp/kakehashi.lua
#   concatenates into $NVIM_CACHE_HOME/kakehashi/lsp.toml and passes to the
#   kakehashi binary via --config-file. Listed BEFORE kakehashi.nvim so its
#   fragments are on rtp when the kakehashi config resolves.
[[plugins]]
repo = "atusy/kakehashi-lspconfig"
on_source = "nvim-lspconfig"
on_event = "FileType"

# kakehashi.nvim (upstream) - Bridge LSP servers and clients
#   https://github.com/atusy/kakehashi.nvim
#   Replaces the kkiyama117/kakehashi.nvim fork (was a git submodule at
#   $NVIM_CONFIG_HOME/plugins/kakehashi.nvim, registered via the
#   dpp-ext-local scan in denops/dpp.ts). The fork's bridge is replaced
#   by after/lsp/kakehashi.lua + lua/kakehashi/config.lua +
#   ~/.config/kakehashi/kakehashi.toml (chezmoi-managed; that dir also
#   holds the dpp parser/queries/grammar)
#   — the --config-file model, like atusy's dotfiles.
#   kakehashi is the sole Neovim LSP client; bridged servers (denols,
#   emmylua_ls, gopls, pyright, tombi, vtsls) run as its children
#   (rust_analyzer is NOT bridged — rustaceanvim owns the rust client;
#   see deps/testing.toml). LSP server binaries are installed by mise,
#   not mason.nvim (see ~/.config/mise/config.toml).
[[plugins]]
repo = "atusy/kakehashi.nvim"
on_source = "nvim-lspconfig"
on_event = "FileType"

# Make the rtp ordering explicit: after/lsp/kakehashi.lua builds lsp.toml
# from kakehashi-lspconfig's lsp/*.toml fragments, so it must be sourced
# first.
depends = ["kakehashi-lspconfig"]
external_commands = ["kakehashi"]
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/kakehashi.nvim.dpp"

