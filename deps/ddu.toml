# ddu.vim and related files
# TODO: think about the load timing;
# See https://github.com/kuuote/dotvim/blob/version5/conf/plug/ddu.toml#L99
[[plugins]]
repo = "shougo/ddu.vim"
depends = "denops.vim"
on_source = "vim-gin"
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/ddu.vim.dpp"

# Add `Ddu` command
[[plugins]]
repo = "Shougo/ddu-commands.vim"
depends = "ddu.vim"
on_cmd = "Ddu"

# ---------------------------------------------------------------------------
# UI
# ---------------------------------------------------------------------------
# Fuzzy Finder
[[plugins]]
repo = "Shougo/ddu-ui-ff"
group = "ddu"
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/ddu-ui-ff.dpp"

# Filer
[[plugins]]
repo = "Shougo/ddu-ui-filer"
group = "ddu"
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/ddu-ui-filer.dpp"

# ---------------------------------------------------------------------------
# SOURCE
# ---------------------------------------------------------------------------
[[plugins]]
repo = "Shougo/ddu-source-action"
group = "ddu"

[[plugins]]
repo = "shun/ddu-source-buffer"
group = "ddu"

[[plugins]]
repo = "Shougo/ddu-source-command_args"
group = "ddu"

# TODO: read its help.
[[plugins]]
repo = "Shougo/ddu-source-dummy"
group = "ddu"

# Files under current dir
[[plugins]]
repo = "Shougo/ddu-source-file"
group = "ddu"

# TODO: check it.
[[plugins]]
repo = "matsui54/ddu-source-file_external"
group = "ddu"

# Files recursive
[[plugins]]
repo = "Shougo/ddu-source-file_rec"
group = "ddu"

[[plugins]]
repo = "Shougo/ddu-source-file_old"
group = "ddu"

# Uri under cursor
[[plugins]]
repo = "Shougo/ddu-source-file_point"
group = "ddu"

# Git branch
[[plugins]]
repo = "kyoh86/ddu-source-git_branch"
group = "ddu"

# Git diff (for git_status kind action)
[[plugins]]
repo = "kuuote/ddu-source-git_diff"
group = "ddu"

# Git stash
[[plugins]]
repo = "peacock0803sz/ddu-source-git_stash"
group = "ddu"

# Git status
[[plugins]]
repo = "kuuote/ddu-source-git_status"
group = "ddu"

# help
[[plugins]]
repo = "Matsui54/ddu-source-help"
group = "ddu"

[[plugins]]
repo = "Shougo/ddu-source-input_history"
group = "ddu"

[[plugins]]
repo = "Shougo/ddu-source-item"
group = "ddu"

[[plugins]]
repo = "Shougo/ddu-source-line"
group = "ddu"

# Sources from LSP
[[plugins]]
repo = "uga-rosa/ddu-source-lsp"
group = "ddu"
lua_add = '''
vim.api.nvim_create_autocmd('LspAttach', {
  pattern = '*',
  group = vim.api.nvim_create_augroup('vimrc#augroup', { clear = false }),
  command = 'let b:ddu_source_lsp_clientName = "nvim-lsp"',
})
'''

# Outputs of command
[[plugins]]
repo = "Shougo/ddu-source-output"
group = "ddu"

[[plugins]]
repo = "Shougo/ddu-source-path_history"
group = "ddu"

[[plugins]]
repo = "flow6852/ddu-source-qf"
group = "ddu"

# registers of vim
[[plugins]]
repo = "Shougo/ddu-source-register"
group = "ddu"

# Use `ripgrep`
[[plugins]]
repo = "shun/ddu-source-rg"
group = "ddu"

[[plugins]]
repo = "4513ECHO/ddu-source-source"
group = "ddu"

