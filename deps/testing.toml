# plugins for testing
# TODO: read them
# https://eiji.page/blog/neovim-overseer-nvim/#-%E4%BB%96%E3%81%AE%E3%83%97%E3%83%A9%E3%82%B0%E3%82%A4%E3%83%B3%E3%81%A8%E3%81%AE%E9%80%A3%E6%90%BA

# nvim-nio: async lib, dependency of nvim-dap-ui
[[plugins]]
repo = "nvim-neotest/nvim-nio"

[[plugins]]
repo = "mfussenegger/nvim-dap"
on_post_source = ["overseer.nvim"]
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/nvim-dap.dpp"

# nvim-dap-ui: fancy UI for the debugger (LazyVim-style keymaps/setup)
[[plugins]]
repo = "rcarriga/nvim-dap-ui"
depends = ["nvim-dap", "nvim-nio"]
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/nvim-dap-ui.dpp"

# nvim-dap-virtual-text: virtual text for debugger variables
[[plugins]]
repo = "theHamsta/nvim-dap-virtual-text"
depends = "nvim-dap"
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/nvim-dap-virtual-text.dpp"

# ===========================================================================
# neotest: test framework
# ===========================================================================
[[plugins]]
repo = "nvim-neotest/neotest"
depends = ["nvim-nio", "nvim-dap"]
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/neotest.dpp"

# ---------------------------------------------------------------------------
# neotest adapters
# `group = "neotest"` (defined in denops/dpp.ts) injects
# `on_source = "neotest"` into each entry: they are sourced in the same
# batch as neotest, BEFORE neotest's lua_source hook runs (dpp source.vim:
# on_source first, then depends; hook_source runs in reverse source order),
# so the setup() in lua/hooks/neotest.dpp can require() them.
# ---------------------------------------------------------------------------

# pytest / unittest
[[plugins]]
repo = "nvim-neotest/neotest-python"
group = "neotest"

# plenary (busted) tests
[[plugins]]
repo = "nvim-neotest/neotest-plenary"
group = "neotest"

# go
[[plugins]]
repo = "nvim-neotest/neotest-go"
group = "neotest"

# deno
[[plugins]]
repo = "MarkEmmons/neotest-deno"
group = "neotest"

# bash (requires the `bashunit` binary)
[[plugins]]
repo = "rcasia/neotest-bash"
group = "neotest"

[[plugins]]
repo = "mrcjkb/rustaceanvim"
on_source = ["neotest", "nvim-lspconfig"]
on_ft = ["rust", "toml"]
depends = ["nvim-dap"]
group = "neotest"
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/rustaceanvim.dpp"

