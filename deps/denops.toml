# Denops itself and Denops-related plugins
[[plugins]]
repo = "vim-denops/denops.vim"
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/denops.vim.lua"

[[plugins]]
repo = "lambdalisue/kensaku.vim"
denops_wait = false

[[plugins]]
repo = "vim-skk/skkeleton"
on_map = { ict = "<Plug>(skkeleton-" }
denops_wait = false
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/skkeleton.lua"

[[plugins]]
repo = "NI57721/skkeleton-state-popup"
on_source = "skkeleton"

[[plugins]]
repo = "NI57721/skkeleton-henkan-highlight"
on_source = "skkeleton"
hook_source = '''
  highlight SkkeletonHenkan
  \ gui=underline term=underline cterm=underline
  highlight SkkeletonHenkanSelect
  \ gui=underline,reverse term=underline,reverse cterm=underline,reverse
'''

[[plugins]]
repo = "lambdalisue/vim-guise"
depends = "denops.vim"
# loaded when `ddt.vim` is sourced.
on_source = "ddt.vim"
# or if this is "child" nvim process, load on events [`VimEnter`, ... etc ];
on_event = ["VimEnter"]
# see `:h dpp_plugin_option_on_if`
# TODO: Not use `$NVIM` directly now, but set variable to show `is_parent`
# and check `(is_parent flag exists) and (not is_parent)` to source in the future.
on_if = "exists('$NVIM')"

[[plugins]]
repo = "lambdalisue/vim-gin"
depends = "denops.vim"
# called by `[DP]g`
on_source = ["ddu.vim"]
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/vim-gin.lua"

