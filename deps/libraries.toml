# lua
[[plugins]]
repo = "nvim-lua/plenary.nvim"

# denops
[[plugins]]
repo = "vim-denops/denops.vim"
hooks_file = "$NVIM_CONFIG_HOME/lua/hooks/denops.vim.dpp"
# At least, We must load until VimEnter
# on_event = ["VimEnter"]

# keep denops shared server alive with pueue (autoload-only; no denops/ dir)
# NOTE: FuncUndefined auto-sourcing does not work: dpp-ext-lazy strips the
# `denops-` prefix from the normalized name (`shared_server_pueue`), which
# never matches the `denops_shared_server_pueue#` function prefix.
[[plugins]]
repo = "kkiyama117/denops-shared-server-pueue.vim"
on_event = "VimEnter"

